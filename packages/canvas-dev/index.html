<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Libre Canvas</title><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8e9ed;background:#202126}*{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{border:1px solid #51525c;border-radius:6px;background:#393a42;color:inherit;padding:6px 12px;cursor:pointer}button:hover{background:#484a55}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #78aafc;outline-offset:2px}header{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid #41424b;background:#2b2c32}.brand{font-weight:650;font-size:16px;letter-spacing:-.3px}.mark{display:inline-grid;place-items:center;color:#acd0ff;border:1px solid #7393c3;border-radius:5px;width:23px;height:23px;margin-right:8px}#filename{color:#c5c7d1;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.badge{font-size:11px;padding:3px 7px;border:1px solid #515563;border-radius:5px;color:#a9c7f1}main{display:grid;grid-template-columns:minmax(300px,42%) minmax(300px,1fr);height:calc(100dvh - 56px)}.editor{display:flex;flex-direction:column;border-right:1px solid #41424b;min-height:0}.bar{height:43px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #3b3d45;background:#27282e}.bar h1,.bar h2{font-size:12px;font-weight:500;margin:0}.bar label{font-size:12px;color:#bbbfc9;white-space:nowrap}textarea{resize:none;flex:1;width:100%;border:0;background:#202126;color:#dce3f0;padding:20px;line-height:1.65;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;min-height:150px}textarea:focus{outline:none}.editor footer{padding:10px 14px;border-top:1px solid #3b3d45;font-size:11px;color:#989eae;min-height:36px}.preview{display:flex;flex-direction:column;min-width:0;min-height:0}.stage{display:grid;place-items:safe center;overflow:auto;flex:1;padding:48px;background:radial-gradient(ellipse at center,#30323b,#25262c 75%);position:relative}.surface{display:none;box-shadow:0 12px 38px #0006,0 0 0 1px #ffffff16;flex:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.empty{color:#9ca2af;text-align:center}.empty strong{display:block;color:#d4d8e1;font-size:18px;font-weight:500;margin-bottom:8px}.bottom{min-height:42px;display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid #3b3d45;background:#27282e}#light{width:7px;height:7px;border-radius:50%;background:#8c929c;flex:none}#light[data-state=ready]{background:#8acc96}#light[data-state=building],#light[data-state=starting]{background:#e9c477}#light[data-state=error]{background:#ed8c89}#status{color:#bcc2cf;font-size:12px}.compat{padding:12px 16px;color:#b6bdcd;background:#292c35;border-top:1px solid #3b3d45;font-size:11px;line-height:1.5}#diagnostic{display:none;max-height:190px;overflow:auto;margin:0;padding:14px 18px;background:#38262a;color:#ffb8b7;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #6d3e44}#conflict{display:none;background:#4b3d24;padding:10px 14px;color:#ffdc9c;font-size:12px}select{color:inherit;background:#393a42;border:1px solid #51525c;border-radius:5px;padding:4px}kbd{font:inherit}@media(max-width:750px){main{grid-template-columns:1fr;height:auto}.editor{height:45dvh;border-right:0}.preview{height:55dvh;min-height:390px}header{padding:0 12px;gap:8px}.badge{display:none}.stage{padding:24px}}

:root{--editor:#202126;--ink:#dce3f0;--comment:#8c97a5;--keyword:#f393cb;--string:#ffac91;--number:#a9b9ff}
:root[data-theme=light]{color-scheme:light;color:#242730;background:#eef0f4;--editor:#fff;--ink:#232632;--comment:#687767;--keyword:#a52b91;--string:#b63526;--number:#405bb3}
:root[data-theme=light] header,:root[data-theme=light] .bar,:root[data-theme=light] .bottom,:root[data-theme=light] .compat{background:#f4f5f7;border-color:#d3d6df;color:#414955}
:root[data-theme=light] button,:root[data-theme=light] select{background:#fff;border-color:#c5cad5;color:#242730}
:root[data-theme=light] .stage{background:radial-gradient(ellipse,#e5e7ed,#d9dce4)}
:root[data-theme=light] #filename,:root[data-theme=light] #status,:root[data-theme=light] .bar label{color:#505866}
.code-editor{position:relative;flex:1;min-height:150px;background:var(--editor);overflow:hidden}
#source,#highlight{position:absolute;inset:0;margin:0;border:0;padding:20px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto;letter-spacing:normal}
#highlight{color:var(--ink);pointer-events:none;scrollbar-width:none}#highlight::-webkit-scrollbar{display:none}
#source{background:transparent;color:transparent;caret-color:var(--ink);-webkit-text-fill-color:transparent;resize:none;width:100%;height:100%}
#source::selection{background:#70a6ed66}.tok-comment{color:var(--comment)}.tok-keyword{color:var(--keyword)}.tok-string{color:var(--string)}.tok-number{color:var(--number)}
#device{max-width:235px}.preview>.bar{height:auto;min-height:43px;flex-wrap:wrap;padding:8px 14px;gap:9px}button:disabled{opacity:.45;cursor:default}.surface{border-radius:16px}canvas{image-rendering:auto}
</style></head>
<body><header><span class="brand"><span class="mark">▧</span>Libre Canvas</span><span id="filename">Connecting…</span><span class="spacer"></span><label class="ui-theme">UI <select id="ui-appearance" aria-label="Web UI appearance"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span class="badge" id="backend">WASM</span><button id="refresh" aria-label="Refresh preview">↻ Refresh</button></header>
<main><section class="editor" aria-label="Source editor"><div class="bar"><h1>Swift source</h1><span class="spacer"></span><label><input type="checkbox" id="autosave" checked> Auto save</label><button id="save">Save</button></div><div id="conflict">Source changed on disk. Your edits are preserved. <button id="reload">Reload file</button></div><div class="code-editor"><pre id="highlight" aria-hidden="true"></pre><textarea id="source" wrap="off" spellcheck="false" aria-label="Swift source" autocomplete="off" autocapitalize="off"></textarea></div><footer id="save-status">Edit here or in your editor. Saved changes refresh automatically.</footer></section>
<section class="preview" aria-label="Canvas"><div class="bar"><h2>Canvas</h2><select id="device" aria-label="Preview device"><option value="desktop">Desktop window</option></select><label>Canvas <select id="appearance" aria-label="Canvas appearance"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label><input id="retina" type="checkbox" checked> @2x Retina</label><label><input id="chrome" type="checkbox"> Titlebar (view only)</label><button id="screenshot" disabled>Screenshot PNG</button><span class="spacer"></span><label><input type="checkbox" id="follow" checked> Auto refresh</label><label>Zoom <select id="zoom" aria-label="Preview zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="1">100%</option><option value="2">200%</option><option value="4" selected>400%</option><option value="8">800%</option></select></label></div><div class="stage"><div id="empty" class="empty"><strong>Your preview appears here</strong>Waiting for the first successful build.</div><div id="surface" class="surface"><canvas id="canvas" aria-label="Rendered preview"></canvas></div></div><pre id="diagnostic" role="alert"></pre><div class="bottom"><span id="light"></span><span id="status" role="status" aria-live="polite">Connecting…</span><span class="spacer"></span><span id="dimensions"></span></div><div class="compat" id="compat">Connecting to the selected source file…</div></section></main><script type="module" src="/app.js"></script></body></html>
