<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Preview viewer</title>
<style>
:root{font:14px system-ui;color:#20232a;background:#f5f6f8}body{margin:0}header{padding:20px 24px;background:white;border-bottom:1px solid #d9dde4}h1{font-size:20px;margin:0 0 6px}p{margin:4px 0;color:#566071}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px}button,label.file{font:inherit;border:1px solid #c6ced8;border-radius:7px;background:white;color:inherit;padding:8px 12px;cursor:pointer}button:focus-visible,label.file:focus-within{outline:3px solid #78a9ff}input[type=file]{max-width:220px}main{display:grid;grid-template-columns:minmax(0,1fr) 250px;min-height:420px}.workspace{padding:32px;overflow:auto;background:repeating-conic-gradient(#edf0f4 0 25%,#f7f8fa 0 50%) 0/16px 16px}.frame{position:relative;display:none;box-shadow:0 4px 24px #1e2f4429;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}.regions{position:absolute;inset:0}.region{position:absolute;border:1px solid transparent;background:transparent;border-radius:0;padding:0}.region:hover{border-color:#326cdf;background:#3278ef22}.region[aria-pressed=true]{border:2px solid #2362dc;background:#3278ef22}.side{background:white;border-left:1px solid #d9dde4;padding:18px;overflow:auto}.side h2{font-size:14px;margin:0 0 12px}.side button{display:block;width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}.side button[aria-pressed=true]{background:#eaf1ff;border-color:#326cdf}#selected{white-space:pre-wrap;overflow-wrap:anywhere;color:#34415b}#status{padding-top:10px;min-height:20px}#status[data-error=true]{color:#b62b32}@media(max-width:650px){main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #d9dde4}}
</style>
<header><h1>Preview viewer</h1><p>Open a captured preview or try the sample. Choose a region to inspect it.</p><div class="toolbar"><label class="file">Open preview file <input id="file" type="file" accept=".bplist,.plist" aria-label="Open preview file"></label><button id="sample">Open sample</button><label><input id="follow" type="checkbox"> Follow sample</label><label>Zoom <input id="zoom" type="range" min="25" max="400" value="100" step="25" aria-label="Zoom"></label><output id="zoomValue">100%</output></div><p id="status" role="status" aria-live="polite">No preview open</p></header>
<main><section class="workspace" aria-label="Preview"><div class="frame" id="frame"><canvas id="canvas" aria-label="Preview image"></canvas><div id="regions" class="regions"></div></div></section><aside class="side"><h2>Selectable regions</h2><div id="regionList"></div><p id="selected">No region selected</p></aside></main>
<script type="module" src="./viewer.js"></script></html>
